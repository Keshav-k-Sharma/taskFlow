<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="40" y="48" font-size="28" font-weight="bold">TaskFlow PostgreSQL schema</text><text x="40" y="83" font-size="17">Every project belongs to one user; every task belongs to one project.</text><rect x="40" y="140" width="340" height="240" rx="12" fill="white" stroke="#94a3b8"/><rect x="40" y="140" width="340" height="48" rx="12" fill="#dbeafe"/><text x="58" y="172" font-size="22">users</text><text x="58" y="217" font-size="16">id: uuid PK</text><text x="58" y="250" font-size="16">full_name: varchar(100)</text><text x="58" y="283" font-size="16">email: varchar(255) UNIQUE</text><text x="58" y="316" font-size="16">password_hash: text</text><text x="58" y="349" font-size="16">created_at: timestamptz</text><rect x="500" y="140" width="350" height="372" rx="12" fill="white" stroke="#94a3b8"/><rect x="500" y="140" width="350" height="48" rx="12" fill="#dcfce7"/><text x="518" y="172" font-size="22">projects</text><text x="518" y="217" font-size="16">id: uuid PK</text><text x="518" y="250" font-size="16">owner_id: uuid FK → users.id</text><text x="518" y="283" font-size="16">name: varchar(150)</text><text x="518" y="316" font-size="16">description: text NULL</text><text x="518" y="349" font-size="16">status: ProjectStatus</text><text x="518" y="382" font-size="16">start_date: date NULL</text><text x="518" y="415" font-size="16">end_date: date NULL</text><text x="518" y="448" font-size="16">created_at: timestamptz</text><text x="518" y="481" font-size="16">updated_at: timestamptz</text><rect x="970" y="140" width="350" height="372" rx="12" fill="white" stroke="#94a3b8"/><rect x="970" y="140" width="350" height="48" rx="12" fill="#fef3c7"/><text x="988" y="172" font-size="22">tasks</text><text x="988" y="217" font-size="16">id: uuid PK</text><text x="988" y="250" font-size="16">project_id: uuid FK → projects.id</text><text x="988" y="283" font-size="16">name: varchar(150)</text><text x="988" y="316" font-size="16">description: text NULL</text><text x="988" y="349" font-size="16">priority: Priority</text><text x="988" y="382" font-size="16">status: TaskStatus</text><text x="988" y="415" font-size="16">due_date: date NULL</text><text x="988" y="448" font-size="16">created_at: timestamptz</text><text x="988" y="481" font-size="16">updated_at: timestamptz</text><path d="M380 235 L490 235" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="393" y="214" font-size="17">1 → many</text><path d="M850 235 L960 235" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="866" y="214" font-size="17">1 → many</text><rect x="40" y="475" width="340" height="141" rx="12" fill="white" stroke="#94a3b8"/><rect x="40" y="475" width="340" height="48" rx="12" fill="#e0e7ff"/><text x="58" y="507" font-size="22">revoked_tokens</text><text x="58" y="552" font-size="16">jti: uuid PK</text><text x="58" y="585" font-size="16">expires_at: timestamptz</text><text x="500" y="570" font-size="17">Foreign keys cascade deletes. Tasks have no owner_id.</text><text x="500" y="610" font-size="17">CHECK: end_date ≥ start_date when both are non-null.</text><text x="40" y="720" font-size="17">Indexes: users(email) UNIQUE · projects(owner_id, status) · tasks(project_id, status)</text><text x="40" y="755" font-size="17">tasks(project_id, priority) · revoked_tokens(expires_at). Revocations have no user FK.</text></g></svg>