components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required:
        - id
        - fullName
        - email
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    AuthResult:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: JWT access token. Never log or commit it.
        user:
          $ref: "#/components/schemas/User"
    Register:
      type: object
      required:
        - fullName
        - email
        - password
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          format: password
          writeOnly: true
      additionalProperties: false
    Login:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
      additionalProperties: false
    Project:
      type: object
      required:
        - id
        - name
        - description
        - status
        - startDate
        - endDate
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - NOT_STARTED
            - IN_PROGRESS
            - COMPLETED
        startDate:
          type: string
          format: date-time
          nullable: true
          example: 2026-10-08T00:00:00.000Z
        endDate:
          type: string
          format: date-time
          nullable: true
          example: 2026-10-08T00:00:00.000Z
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required:
            - tasks
          properties:
            tasks:
              type: array
              items:
                $ref: "#/components/schemas/TaskBrief"
    ProjectCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - NOT_STARTED
            - IN_PROGRESS
            - COMPLETED
          default: NOT_STARTED
        startDate:
          type: string
          format: date
          nullable: true
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-10-08
        endDate:
          type: string
          format: date
          nullable: true
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-10-08
      additionalProperties: false
    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - NOT_STARTED
            - IN_PROGRESS
