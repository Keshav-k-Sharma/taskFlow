openapi: 3.0.3
info:
  title: TaskFlow API
  version: 1.0.0
  description: Shared web and Android REST API. Owner IDs come from authentication. Input dates must
    be valid YYYY-MM-DD calendar dates; response dates are UTC date-time strings. Unknown request
    fields are rejected.
servers:
  - url: /api
    description: Same API host
  - url: http://localhost:5000/api
    description: Local development
  - url: https://taskflow-1sh2.onrender.com/api
    description: Render deployment
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Project
  - name: Task
  - name: Dashboard
  - name: System
paths:
  /health:
    get:
      tags:
        - System
      summary: Process liveness (does not check the database)
      security: []
      responses:
        "200":
          description: API process is running
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - UP
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a user
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, expired, invalid or revoked token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Browser origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: JSON request body exceeds 10 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Request rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Register"
